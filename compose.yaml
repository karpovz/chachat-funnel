services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: chachat
      POSTGRES_PASSWORD: chachat_local
      POSTGRES_DB: chachat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chachat -d chachat"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://chachat:chachat_local@db:5432/chachat?schema=public
      APP_ORIGIN: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://chachat:chachat_local@db:5432/chachat?schema=public
      APP_ORIGIN: http://localhost:3000
      # Local Compose is HTTP. Set true behind HTTPS in a deployed environment.
      COOKIE_SECURE: "false"
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/plans').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
